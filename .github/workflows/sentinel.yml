name: Sentinel Monitor

on:
  push:
  pull_request:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate hash report
        run: |
          mkdir -p security-logs
          find . -type f -not -path "./.git/*" -exec sha256sum {} \; | sort > security-logs/hash.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: hash-report
          path: security-logs/hash.txt
